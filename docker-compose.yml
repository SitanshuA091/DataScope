services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    command: >
      sh -c "uv sync --frozen &&
             uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - backend_venv:/app/.venv
      - backend_uv_cache:/root/.cache/uv
    environment:
      APP_ENV: local
      DEBUG: "true"
      DOCS_ENABLED: "true"
      LOG_LEVEL: INFO
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SESSION_SECRET_KEY: local-dev-session-secret
      GOOGLE_CLIENT_ID: local-dev-google-client-id
      GOOGLE_CLIENT_SECRET: local-dev-google-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      GOOGLE_API_KEY: local-dev-google-api-key
      GROQ_API_KEY: local-dev-groq-api-key
      DATABASE_URL: postgresql+psycopg://datascope:datascope@postgres:5432/datascope
      REDIS_URL: redis://redis:6379/0
      R2_ENDPOINT_URL: http://localhost
      R2_ACCESS_KEY_ID: local-dev-r2-access-key-id
      R2_SECRET_ACCESS_KEY: local-dev-r2-secret-access-key
      R2_BUCKET_NAME: local-dev-r2-bucket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: datascope
      POSTGRES_USER: datascope
      POSTGRES_PASSWORD: datascope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datascope -d datascope"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_venv:
  backend_uv_cache:
  postgres_data:
  redis_data:
